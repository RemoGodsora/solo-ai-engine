name: Solo AI Studio CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Pytest & Isolation Verification
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock_groq_key_for_testing' }}
      MASTER_ADMIN_KEY: dev_secret_key_123
      DATABASE_URL: sqlite+aiosqlite:///./test_studio.db
      DISCORD_SLACK_WEBHOOK_URL: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (for PDF / Reporting Support)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Test Suite
        run: |
          pytest -v --disable-warnings