services:
  solo-ai-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solo-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MASTER_ADMIN_KEY=${MASTER_ADMIN_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./studio.db}
      - DISCORD_SLACK_WEBHOOK_URL=${DISCORD_SLACK_WEBHOOK_URL:-}
    volumes:
      - studio_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  studio_data:
    driver: local